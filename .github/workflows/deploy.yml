name: Deploy Node.js PM2 App (Production)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        script: |                    
          cd /root/HierroExpress-Frontend

          git config --global user.name "${{ secrets.GIT_USERNAME }}"
          git config --global user.email "noreply@github.com"
          git remote set-url origin https://${{ secrets.GIT_USERNAME }}:${{ secrets.GIT_TOKEN }}@github.com/HierroExpress/HierroExpress-Frontend.git

          git fetch --all
          git reset --hard origin/main
          git pull origin main

          npm install
          npm run build
          pm2 restart frontend
          
          # pm2 start npm --name "frontend" -- start